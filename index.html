<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SECTIONyt PUBG STORE | Premium Gaming & Social Services</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #f1c40f; --dark-gold: #d4ac0d; --black: #000000; --card-bg: #121212; --text: #ffffff; --gray: #b0b0b0; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; scroll-behavior: smooth; }
        body { background-color: var(--black); color: var(--text); line-height: 1.6; background-image: radial-gradient(#1f1f1f 1px, transparent 1px); background-size: 30px 30px; }

        header { background: rgba(5, 5, 5, 0.95); border-bottom: 2px solid var(--gold); padding: 12px 5%; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 1000; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.9); }
        .logo { font-size: 20px; font-weight: 700; color: var(--gold); text-transform: uppercase; border: 2px solid var(--gold); padding: 4px 12px; border-radius: 8px; }
        nav ul { display: flex; list-style: none; gap: 15px; }
        nav a { color: var(--text); text-decoration: none; font-size: 13px; }
        .header-btn { background: linear-gradient(145deg, var(--gold), var(--dark-gold)); color: #000; padding: 6px 15px; border-radius: 20px; font-weight: bold; font-size: 12px; text-decoration: none; }

        .container { max-width: 1100px; margin: auto; padding: 40px 15px; }
        h2 { text-align: center; color: var(--gold); margin-bottom: 35px; text-transform: uppercase; font-size: 1.8rem; }

        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 25px; }
        .card { background: #121212; border: 1px solid #333; padding: 20px; border-radius: 16px; text-align: center; border-bottom: 4px solid var(--gold); }
        .btn-order { background: #2ecc71; color: white; padding: 10px 18px; text-decoration: none; border-radius: 25px; font-size: 12px; display: inline-block; margin-top: 15px; }

        .review-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; }
        .review-card { background: #121212; padding: 20px; border-radius: 14px; border: 1px solid #333; border-top: 3px solid var(--gold); }
        .stars { color: var(--gold); font-size: 12px; }

        /* Load More Button Style */
        .load-more-btn { 
            background: transparent; color: var(--gold); border: 2px solid var(--gold); 
            padding: 10px 30px; border-radius: 25px; cursor: pointer; font-weight: bold; 
            margin-top: 20px; transition: 0.3s;
        }
        .load-more-btn:hover { background: var(--gold); color: #000; }

        footer { text-align: center; padding: 35px; color: var(--gray); border-top: 2px solid var(--gold); margin-top: 60px; }
    </style>
</head>
<body>

    <header>
        <div class="logo">SECTIONyt</div>
        <nav><ul><li><a href="#services">Services</a></li><li><a href="#reviews">Reviews</a></li></ul></nav>
        <a href="https://api.whatsapp.com/send?phone=923291740304" target="_blank" class="header-btn">💬 WhatsApp</a>
    </header>

    <div class="container">
        <section id="services">
            <h2>Our Premium Services</h2>
            <div class="grid">
                <!-- Services Cards -->
                <div class="card"><h3>PUBG Accounts</h3><p>Rare X-Suit & Mythic accounts.</p><a href="#" class="btn-order">Order Now</a></div>
                <div class="card"><h3>UC Top-Up</h3><p>Safe & Instant UC via Player ID.</p><a href="#" class="btn-order">Order Now</a></div>
                <div class="card"><h3>Social Growth</h3><p>Real Followers, Likes & Views.</p><a href="#" class="btn-order">Order Now</a></div>
            </div>
        </section>

        <section id="reviews" style="margin-top: 60px;">
            <h2>Customer Reviews</h2>
            <div class="review-grid" id="review-list"></div>
            
            <!-- Load More Section -->
            <div id="load-more-container" style="text-align: center; margin-top: 30px; display: none;">
                <button class="load-more-btn" onclick="loadMore()">Load More Reviews</button>
            </div>
        </section>

        <!-- Add Review -->
        <section style="margin-top: 60px; padding: 30px; background: #0a0a0a; border-radius: 15px;">
            <h2>Add Your Review</h2>
            <div style="max-width: 400px; margin: auto;">
                <input type="text" id="revName" placeholder="Name" style="width: 100%; padding: 10px; margin-bottom: 10px; background: #000; border: 1px solid #444; color: #fff;">
                <textarea id="revComment" placeholder="Feedback..." style="width: 100%; padding: 10px; margin-bottom: 10px; background: #000; border: 1px solid #444; color: #fff; height: 80px;"></textarea>
                <button onclick="submitReview()" style="width: 100%; padding: 10px; background: var(--gold); border: none; cursor: pointer; font-weight: bold;">Post Review</button>
            </div>
        </section>
    </div>

    <script>
        // Initial list
        const defaultReviews = [
            { name: "Muhammad Ali", stars: "★★★★★", comment: "Bhai ne 3 minutes mein UC transfer kar diye." },
            { name: "Shahzaib Khan", stars: "★★★★★", comment: "X-Suit account verified and trusted!" },
            { name: "Usman Ahmed", stars: "★★★★★", comment: "Best store in Pakistan." },
            { name: "Hamza Malik", stars: "★★★★★", comment: "Amazing service! Highly recommended." },
            { name: "Bilal Raza", stars: "★★★★★", comment: "Netflix subscription best hai." },
            { name: "Zain", stars: "★★★★★", comment: "Payment 5 minute me mil gayi." },
            { name: "Danyal", stars: "★★★★★", comment: "TikTok coins top-up sab se sathy rates." }
        ];

        let visibleCount = 6; // Initially show 6 reviews

        function renderReviews() {
            var reviewList = document.getElementById('review-list');
            var loadMoreBtn = document.getElementById('load-more-container');
            reviewList.innerHTML = '';
            
            var savedReviews = JSON.parse(localStorage.getItem('myReviews')) || [];
            var allReviews = savedReviews.concat(defaultReviews);

            // Show only up to visibleCount
            var displayList = allReviews.slice(0, visibleCount);

            displayList.forEach(function(rev) {
                var card = document.createElement('div');
                card.className = 'review-card';
                card.innerHTML = `<div style="font-weight:bold">${rev.name} <span class="stars">${rev.stars}</span></div><p style="font-size:12px; color:#aaa; margin-top:5px">"${rev.comment}"</p>`;
                reviewList.appendChild(card);
            });

            // Show "Load More" button only if there are more reviews to show
            if (allReviews.length > visibleCount) {
                loadMoreBtn.style.display = 'block';
            } else {
                loadMoreBtn.style.display = 'none';
            }
        }

        function loadMore() {
            visibleCount += 6; // Increase limit by 6
            renderReviews();
        }

        function submitReview() {
            var n = document.getElementById('revName').value;
            var c = document.getElementById('revComment').value;
            if(n && c) {
                var newRev = { name: n, stars: "★★★★★", comment: c };
                var saved = JSON.parse(localStorage.getItem('myReviews')) || [];
                saved.unshift(newRev);
                localStorage.setItem('myReviews', JSON.stringify(saved));
                renderReviews();
                alert("Review submitted!");
            }
        }

        window.onload = renderReviews;
    </script>
</body>
</html>
